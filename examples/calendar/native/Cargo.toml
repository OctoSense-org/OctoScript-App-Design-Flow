[package]
name = "octosense-calendar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The Calendar app as an in-process OctoSense AppModule: native Makepad L0 scenes built at runtime from the calendar state, synced through the calendar service"

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "33dea2f1f3ad3f1346a219aa8cf6e91b31361e23" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "33dea2f1f3ad3f1346a219aa8cf6e91b31361e23" }
octoscript-node = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "33dea2f1f3ad3f1346a219aa8cf6e91b31361e23" }
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "2e37d9e657a246f16718d9a475e167ccd2d5b5fa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"

# Standalone builds (cargo test here) resolve the pinned sources from the
# prepared siblings, as the launcher workspace does; ignored as a dependency.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../../../../makepad/widgets" }
makepad-app-module = { path = "../../../../makepad/libs/app_module" }
makepad-script = { path = "../../../../makepad/platform/script" }
makepad-ai-services = { path = "../../../../makepad/libs/ai/services" }
makepad-strict-json = { path = "../../../../makepad/libs/strict_json" }
makepad-studio-protocol = { path = "../../../../makepad/platform/studio" }
makepad-network = { path = "../../../../makepad/platform/network" }
[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = "../../../../octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = "../../../../octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = "../../../../octoscript-makepad/crates/octoscript-node" }
[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../../../../octoscript/crates/octoscript-ui-l0" }
