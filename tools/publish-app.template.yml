name: Publish OctoSense app

# Generated by tools/octo publish-github. No publisher signing secret is needed.
# Push a new v<manifest.version> tag after reviewing the app and screenshots.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: octosense-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Require a public tagged release
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != false ] || [ "$GITHUB_REF_TYPE" != tag ]; then
            echo '::error::OctoSense publishing requires a tag in a public app repository.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: OctoSense-org/OctoSense-App-Hub
          ref: __HUB_REVISION__
          path: tools/app-hub
          persist-credentials: false
      - name: Read the pinned native runtime
        id: runtime
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          pins = set()
          for manifest in pathlib.Path('tools/app-hub/crates').glob('*/Cargo.toml'):
              for line in manifest.read_text().splitlines():
                  if 'git = "https://github.com/OctoSense-org/Octoscript-Makepad.git"' in line:
                      pin = re.search(r'rev\s*=\s*"([0-9a-f]{40})"', line)
                      assert pin, 'Missing immutable runtime revision'
                      pins.add(pin[1])
          assert len(pins) == 1, 'Expected one runtime revision'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + pins.pop() + '\n')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: OctoSense-org/Octoscript-Makepad
          ref: ${{ steps.runtime.outputs.revision }}
          path: tools/octoscript-makepad
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2
      - name: Build trusted tools
        run: |
          python3 tools/octoscript-makepad/tools/runtime.py prepare --root "$GITHUB_WORKSPACE/tools"
          cargo build --manifest-path tools/app-hub/Cargo.toml --locked --release -p octosense-app-hub
      - name: Build the app's Rust components
        # Each crate in components/ (tools/octo wasm new) is built here, from
        # the tagged commit, with the toolchain above. Its component replaces
        # bundle/fns/<name>.wasm, so the release attests binaries built from
        # this source, wherever the committed ones came from. A crate needs
        # its Cargo.lock, and the SDK by git rather than by a local path.
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          try:
              import tomllib
          except ModuleNotFoundError:  # Python before 3.11
              tomllib = None
          app = pathlib.Path('app')
          fns = app / 'bundle' / 'fns'
          for crate in sorted(p.parent for p in app.glob('components/*/Cargo.toml')):
              manifest = crate / 'Cargo.toml'
              # Before cargo reads it: a local path is missing here, and
              # cargo would only say so.
              text = manifest.read_text()
              if tomllib:
                  sdk = tomllib.loads(text).get('dependencies', {}).get('octosense-component')
                  local = isinstance(sdk, dict) and 'path' in sdk
              else:
                  local = re.search(r'(?m)^octosense-component\s*=\s*\{[^}\n]*\bpath\s*=', text) is not None
              if local:
                  sys.exit(f'::error::{crate} takes the SDK from a local path, which the release cannot build; '
                           'depend on OctoSense App Flow by git (tools/octo wasm new --sdk git)')
              meta = json.loads(subprocess.run(
                  ['cargo', 'metadata', '--no-deps', '--format-version', '1', '--manifest-path', str(manifest)],
                  check=True, capture_output=True, text=True).stdout)
              package = next(p for p in meta['packages']
                             if pathlib.Path(p['manifest_path']).resolve() == manifest.resolve())
              if not (crate / 'Cargo.lock').is_file():
                  sys.exit(f'::error::{crate} has no Cargo.lock: commit it, so the release builds what you tested')
              built = subprocess.run(
                  ['cargo', 'build', '--locked', '--release', '--target', 'wasm32-wasip2',
                   '--manifest-path', str(manifest), '--message-format=json-render-diagnostics'],
                  stdout=subprocess.PIPE, text=True)
              if built.returncode:
                  sys.exit(built.returncode)
              artifact = None
              for line in built.stdout.splitlines():
                  try:
                      message = json.loads(line)
                  except ValueError:
                      continue
                  if message.get('reason') == 'compiler-artifact' and message.get('package_id') == package['id']:
                      artifact = next((f for f in message.get('filenames') or [] if f.endswith('.wasm')), artifact)
              if artifact is None:
                  sys.exit(f'::error::{crate} built no .wasm file: its [lib] needs crate-type = ["cdylib", "rlib"]')
              data = pathlib.Path(artifact).read_bytes()
              target = fns / (package['name'] + '.wasm')
              state = ('unchanged' if target.is_file() and target.read_bytes() == data
                       else 'replaced' if target.is_file() else 'added')
              fns.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f'{state}: bundle/fns/{target.name}, {len(data):,} bytes built from {crate}')
          PY
      - name: Check final files and prepare their signing subject
        run: |
          mkdir -p "$RUNNER_TEMP/prepared"
          tools/app-hub/target/release/hub publisher-prepare app/bundle \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --workflow .github/workflows/publish-app.yml \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/prepared/octosense-app-manifest.json"
          cp -R app/bundle "$RUNNER_TEMP/prepared/bundle"
          cp tools/app-hub/target/release/hub "$RUNNER_TEMP/prepared/hub"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - name: GitHub attests the exact manifest and bundle digest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/prepared/octosense-app-manifest.json
      - name: Verify the proof and pack the sealed app
        env:
          ATTESTATION_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          chmod 700 "$RUNNER_TEMP/prepared/hub"
          "$RUNNER_TEMP/prepared/hub" publisher-attach "$RUNNER_TEMP/prepared/bundle" \
            --attestation "$ATTESTATION_PATH"
          "$RUNNER_TEMP/prepared/hub" publisher-verify "$RUNNER_TEMP/prepared/bundle"
          "$RUNNER_TEMP/prepared/hub" publisher-pack "$RUNNER_TEMP/prepared/bundle" \
            --out "$RUNNER_TEMP/prepared/app.bundle.pack.json"
      - name: Write the submission receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'prepared'
          manifest = json.loads((root / 'bundle/manifest.json').read_text())
          receipt = {
              'schema': 1, 'app_id': manifest['id'], 'version': manifest['version'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'], 'tag': os.environ['GITHUB_REF_NAME'],
              'run': os.environ['GITHUB_RUN_ID'],
              'pack_sha256': hashlib.sha256((root / 'app.bundle.pack.json').read_bytes()).hexdigest(),
              'hub_admission': 'not granted by this workflow',
          }
          (root / 'release-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (root / 'SUBMISSION.md').write_text(
              'This release was checked and sealed by the OctoSense publishing workflow.\n\n'
              'Open or update your submission issue with this release link and app review evidence at '
              'https://github.com/OctoSense-org/OctoSense-App-Hub/issues. '
              'A maintainer still needs to review and admit the exact app files.\n\n'
              'Download `app.bundle.pack.json` for the sealed app; the repository keeps '
              'the editable development bundle. A compatible OctoSense host must support '
              '`publisher-github-v1`.\n\n'
              '```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY
      - name: Create the immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/prepared/SUBMISSION.md" \
            "$RUNNER_TEMP/prepared/app.bundle.pack.json" \
            "$RUNNER_TEMP/prepared/octosense-app-manifest.json" \
            "$RUNNER_TEMP/prepared/release-receipt.json"
