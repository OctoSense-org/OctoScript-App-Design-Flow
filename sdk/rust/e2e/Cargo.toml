[package]
name = "octosense-component-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
wasmtime = { version = "49.0.2", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }
# A component's wasi:http, linked as OctoSense's runtime links it (ADR 0014
# phase 3): WASI 0.2 only, sent with rustls and ring.
wasmtime-wasi-http = { version = "49.0.2", default-features = false, features = ["p2", "default-send-request"] }
# The request and response types of the hook that admits a request.
http = "1"
http-body-util = "0.1"
# The fake host services read their arguments as JSON, as OctoSense's do.
serde_json = "1"
