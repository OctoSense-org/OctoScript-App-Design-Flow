# The Rust SDK for OctoSense app components (OctoSense ADR 0014): ordinary
# Rust functions become a WebAssembly component the shell's `wasm` service
# calls from an app's script, with no WIT and no glue to write.
[workspace]
resolver = "2"
members = [
    "octosense-component",
    "octosense-component-macros",
    "examples/markdown-tools",
    "examples/type-tour",
    "examples/template",
    "e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# wit-bindgen 0.62 needs 1.85; wasm32-wasip2 builds components from 1.82.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/OctoSense-org/OctoSense-App-Flow"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
