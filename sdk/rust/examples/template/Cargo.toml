[package]
name = "component-template"
version = "0.1.0"
# The template's own edition and Rust (templates/rust-component/Cargo.toml.template).
edition = "2024"
rust-version = "1.85"
publish = false
description = "The crate `tools/octo wasm new` writes, built here so its tests and the end-to-end tests run it."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
octosense-component = { path = "../../octosense-component" }
